name: Fetch BTC Signals

on:
  schedule:
    # 每小时运行（价格/资金费率实时；链上指标日更，无变化则跳过 commit）
    - cron: '0 * * * *'
  workflow_dispatch:
    # 支持手动触发，便于调试

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run fetch-signals.js
        run: node scripts/fetch-signals.js

      - name: Check if signals-feed.json changed
        id: check_changes
        run: |
          git diff --quiet docs/signals-feed.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated signals-feed.json
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/signals-feed.json
          git commit -m "chore: update signals-feed.json $(date -u +%Y-%m-%dT%H:%M)Z"
          git push

      - name: No changes detected
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "signals-feed.json 未变化，跳过提交。"
